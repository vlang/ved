name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
          path: v
      - name: Checkout ved
        uses: actions/checkout@v4
        with:
          path: ved
      - name: Build V
        working-directory: v
        run: .\makev.bat -msvc
      - name: Register V
        working-directory: v
        run: .\v.exe symlink
      - name: Build ved
        working-directory: ved
        run: v -prod -o ved.exe .
      - name: Package zip
        working-directory: ved
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          @('ved.exe', 'README.md', 'LICENSE', 'welcome.txt', 'RobotoMono-Regular.ttf') | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ dist/ }
          }
          Compress-Archive -Path dist/* -DestinationPath ved-windows-x86_64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ved-windows-x86_64
          path: ved/ved-windows-x86_64.zip
          if-no-files-found: error

  deb:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
          path: v
      - name: Checkout ved
        uses: actions/checkout@v4
        with:
          path: ved
      - name: Build V
        working-directory: v
        run: make && ./v symlink
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --quiet libfreetype6-dev libglfw3-dev libxi-dev libxcursor-dev
      - name: Build ved
        working-directory: ved
        run: v -prod -o ved .
      - name: Package deb
        working-directory: ved
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          ARCH="$(dpkg --print-architecture)"
          PKG="ved_${VER}_${ARCH}"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/ved" \
            "$PKG/usr/share/applications"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: ved
          Version: $VER
          Section: editors
          Priority: optional
          Architecture: $ARCH
          Maintainer: Vlang Team <team@vlang.io>
          Homepage: https://github.com/vlang/ved
          Description: Small and fast text editor written in V
           Ved is a small, hardware-accelerated text editor with syntax
           highlighting, a fuzzy file finder, git integration and a
           growing Vim mode.
          EOF
          install -m 0755 ved "$PKG/usr/bin/ved"
          install -m 0644 README.md "$PKG/usr/share/doc/ved/README.md"
          install -m 0644 LICENSE "$PKG/usr/share/doc/ved/copyright"
          cat > "$PKG/usr/share/applications/ved.desktop" <<EOF
          [Desktop Entry]
          Name=ved
          Comment=Small and fast text editor written in V
          Exec=ved
          Icon=ved
          Terminal=false
          Type=Application
          Categories=Development;TextEditor;
          EOF
          dpkg-deb --build --root-owner-group "$PKG"
          mv "${PKG}.deb" ved-x86_64.deb
          dpkg-deb --info ved-x86_64.deb
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ved-x86_64-deb
          path: ved/ved-x86_64.deb
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout V
        uses: actions/checkout@v4
        with:
          repository: vlang/v
          path: v
      - name: Checkout ved
        uses: actions/checkout@v4
        with:
          path: ved
      - name: Build V
        working-directory: v
        run: make && ./v symlink
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --quiet rpm libfreetype6-dev libglfw3-dev libxi-dev libxcursor-dev
      - name: Build ved
        working-directory: ved
        run: v -prod -o ved .
      - name: Package rpm
        working-directory: ved
        shell: bash
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          mkdir -p rpmbuild/BUILD rpmbuild/RPMS rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/SRPMS
          mkdir -p staging/usr/bin staging/usr/share/doc/ved
          install -m 0755 ved staging/usr/bin/ved
          install -m 0644 README.md staging/usr/share/doc/ved/README.md
          install -m 0644 LICENSE staging/usr/share/doc/ved/LICENSE
          tar -czf "rpmbuild/SOURCES/ved-${VER}.tar.gz" -C staging .
          cat > rpmbuild/SPECS/ved.spec <<EOF
          Name:           ved
          Version:        $VER
          Release:        1%{?dist}
          Summary:        Small and fast text editor written in V
          License:        GPL-3.0-only
          URL:            https://github.com/vlang/ved
          Source0:        ved-%{version}.tar.gz
          %global debug_package %{nil}

          %description
          Ved is a small, hardware-accelerated text editor with syntax
          highlighting, a fuzzy file finder, git integration and a
          growing Vim mode.

          %install
          mkdir -p %{buildroot}
          tar -xzf %{SOURCE0} -C %{buildroot}

          %files
          %{_bindir}/ved
          %{_datadir}/doc/ved/*

          %changelog
          * Sun Nov 22 2026 Vlang Team <team@vlang.io> - $VER-1
          - Automated release build
          EOF
          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/ved.spec
          cp rpmbuild/RPMS/*/ved-${VER}-1.*.rpm ved-x86_64.rpm
          rpm -qip ved-x86_64.rpm
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ved-x86_64-rpm
          path: ved/ved-x86_64.rpm
          if-no-files-found: error

  publish:
    needs: [windows, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: |
            artifacts/ved-windows-x86_64.zip
            artifacts/ved-x86_64.deb
            artifacts/ved-x86_64.rpm
          generate_release_notes: true
