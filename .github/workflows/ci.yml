name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '31 1,12 * * *'

jobs:
  code-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v
      - name: Checkout ved
        id: checkout_ved
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: ved
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_ved.outcome == 'success' }}
        run: make && ./v symlink -githubci
      - name: v vet
        id: v_vet
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: v vet ved/
      - name: v fmt -verify
        id: v_fmt_verify
        if: ${{ success() && !cancelled() && steps.v_vet.outcome == 'success' }}
        run: v fmt -verify ved/

  check-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        run: make && ./v symlink -githubci
      - name: Checkout ved
        id: checkout_ved
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: ved
      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.checkout_ved.outcome == 'success' }}
        run: |
          v retry -- sudo apt-get update
          v retry -- sudo apt-get install --quiet -y \
                          libfreetype6-dev libglfw3-dev libxi-dev libxcursor-dev
      - name: Build ved
        id: build_ved
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          cd ved
          v -prod .
          v -autofree .

  check-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v
      - name: Checkout ved
        id: checkout_ved
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: ved
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_ved.outcome == 'success' }}
        run: make && ./v symlink -githubci
      - name: Build ved
        id: build_ved
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: |
          cd ved
          v .
          v -prod .

  check-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v7
        with:
          repository: vlang/v
      - name: Checkout ved
        id: checkout_ved
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          path: ved
      - name: Build V
        id: build_v
        if: ${{ success() && !cancelled() && steps.checkout_ved.outcome == 'success' }}
        run: |
          .\makev.bat -msvc
          .\v.exe symlink -githubci
      - name: Build ved
        id: build_ved
        if: ${{ success() && !cancelled() && steps.build_v.outcome == 'success' }}
        run: |
          cd ved
          v -prod .
